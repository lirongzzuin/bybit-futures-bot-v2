name: Deploy to fly.io

# 저장소 공개 후 push 마다 실거래 봇이 재배포되지 않도록 수동 실행으로만 둔다.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate FLY_API_TOKEN
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Go to repo Settings → Secrets → Actions and add it."
            exit 1
          fi
          echo "FLY_API_TOKEN is configured, verifying..."
          flyctl auth whoami || {
            echo "::error::FLY_API_TOKEN is invalid or expired. Regenerate it with: flyctl tokens create deploy -x 999999h"
            exit 1
          }
          echo "✅ Token is valid"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to fly.io
        run: flyctl deploy --strategy rolling --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
