app = "your-fly-app-name"
primary_region = "nrt"  # 도쿄 (Bybit 서버에 가까움)

[build]

[env]
  PYTHONUNBUFFERED = "1"
  DATA_DIR = "/data"
  BYBIT_TESTNET = "true"

# 무료 티어: shared-cpu-1x, 256MB
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# 영구 볼륨 (SQLite DB + 로그 보존)
[mounts]
  source = "bot_data"
  destination = "/data"

# 웹훅 서버용 HTTP (선택사항 - TradingView 웹훅 수신 시)
[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  # 헬스체크 (fly.io가 앱 상태 확인)
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"
