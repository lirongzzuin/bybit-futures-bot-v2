app = "your-fly-app-name"
primary_region = "nrt"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  DATA_DIR = "/data"
  BYBIT_TESTNET = "false"
  PAPER_TRADING = "false"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "bot_data"
  destination = "/data"

# v15.0: 24/7 상시 가동
[http_service]
  internal_port = 5000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"
